                { id: 103, lec: 1, t: 'mcq', 
                  qE: "Which of the following best describes the relationship between temperature and the viscosity of a fluid?", qA: "أي مما يلي يصف بشكل أفضل العلاقة بين درجة الحرارة ولزوجة المائع؟",

                { id: 104, lec: 1, t: 'mcq',

                { id: 108, lec: 1, t: 'mcq',

                  oE: ["It must decrease", "It must increase", "It remains 0.2 m/s", "It drops to zero"],

                { id: 111, lec: 1, t: 'mcq',

                  oE: ["An increase in fluid speed results in an increase in internal pressure", "An increase in fluid speed results in a reduction in internal pressure", "Fluid speed has no effect on internal pressure", "Pressure only changes based on temperature"], 
                  oA: ["زيادة سرعة المائع تؤدي إلى زيادة الضغط الداخلي", "زيادة سرعة المائع تؤدي إلى انخفاض الضغط الداخلي", "سرعة المائع ليس لها تأثير على الضغط الداخلي", "الضغط يتغير فقط بناءً على درجة الحرارة"], 
                  a: 1, eE: "The Bernoulli Equation shows that an increase in fluid speed corresponds to a decrease in internal pressure.", eA: "توضح معادلة برنولي أن زيادة سرعة المائع تقابلها انخفاض في الضغط الداخلي." },

                { id: 112, lec: 1, t: 'tf',

                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 0, eE: "This is a fundamental distinction. Pascal deals with statics, Bernoulli with dynamics.", eA: "هذا تمييز أساسي. يتعامل باسكال مع السكون، وبرنولي مع الديناميكا." },

                { id: 113, lec: 1, t: 'mcq', 
                  qE: "The Reynolds Number is a dimensionless ratio used to determine flow type. It is the ratio of:", qA: "رقم رينولدز هو نسبة لا أبعاد لها تستخدم لتحديد نوع التدفق. وهو نسبة:",

                  oE: ["Re < 1000", "1000 < Re < 2000", "Re > 2000", "Re = 0"], 
                  oA: ["Re < 1000", "1000 < Re < 2000", "Re > 2000", "Re = 0"],

                { id: 116, lec: 1, t: 'mcq', 
                  qE: "In a series hydraulic circuit, how is the total required pressure calculated?", qA: "في دائرة هيدروليكية متوالية، كيف يتم حساب الضغط الكلي المطلوب؟", 
                  oE: ["It is equal to the smallest pressure drop", "The pressure drops are additive (cumulative)", "It is the average of all pressure drops", "It is constant throughout the entire circuit"],

                  a: 1, eE: "In series, the pump must supply a pressure equal to the sum of all individual pressure drops in the line.", eA: "في التوصيل على التوالي، يجب أن توفر المضخة ضغطًا يساوي مجموع كل انخفاضات الضغط الفردية في الخط." },

                { id: 117, lec: 1, t: 'tf',

                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 1, eE: "In a parallel circuit, closing a branch simply diverts fluid to other paths; the pressure available at the manifold remains governed by the load on the active branches.", eA: "في الدائرة المتوازية، يؤدي إغلاق فرع ببساطة إلى تحويل المائع إلى مسارات أخرى؛ يظل الضغط المتاح عند المشعب محكومًا بالحمل على الفروع النشطة." },

                { id: 118, lec: 1, t: 'mcq', 
                  qE: "When calculating the actual Input Power required by an electric motor driving a hydraulic pump, which inefficiencies must be considered?", qA: "عند حساب طاقة الإدخال الفعلية المطلوبة بواسطة محرك كهربائي يشغل مضخة هيدروليكية، ما هي أوجه القصور التي يجب مراعاتها؟", 
                  oE: ["Only the motor efficiency", "Only the pump efficiency", "Both the motor efficiency and the pump efficiency", "The flow rate efficiency only"], 
                  oA: ["كفاءة المحرك فقط", "كفاءة المضخة فقط", "كفاءة المحرك وكفاءة المضخة معًا", "كفاءة معدل التدفق فقط"], 
                  a: 2, eE: "Pin(kW) = Psupply(kW) / (efficiency motor * efficiency pump). Both must be factored in.", eA: "طاقة الإدخال = طاقة الإمداد / (كفاءة المحرك * كفاءة المضخة). يجب أخذ كليهما في الاعتبار." },

                { id: 119, lec: 1, t: 'tf', 
                  qE: "Fluid statics is defined as the science that deals with the behavior of fluid in dynamic motion.", qA: "تعرف استاتيكا الموائع بأنها العلم الذي يتعامل مع سلوك المائع في الحركة الديناميكية.", 
                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 1, eE: "Fluid statics deals with fluids at rest. Fluid dynamics deals with fluids in motion.", eA: "تتعامل استاتيكا الموائع مع الموائع في حالة السكون. بينما تتعامل ديناميكا الموائع مع الموائع المتحركة." },

                { id: 120, lec: 1, t: 'mcq',

                  oE: ["Mechanical transmission", "Electrical transmission", "Fluid power", "Thermal transmission"], 
                  oA: ["النقل الميكانيكي", "النقل الكهربائي", "طاقة الموائع", "النقل الحراري"], 
                  a: 2, eE: "Fluid power uses liquids or gases in a confined space to transmit power from one point to another.", eA: "تستخدم طاقة الموائع السوائل أو الغازات في مساحة محصورة لنقل الطاقة من نقطة إلى أخرى." },

                // === LECTURE 2 ===
                { id: 201, lec: 2, t: 'mcq',

                  a: 1, eE: "Stationary hydraulics apply to systems fixed in one position, like presses and assembly machines.", eA: "ينطبق الهيدروليك الثابت على الأنظمة الثابتة في موضع واحد، مثل المكابس وآلات التجميع." },

                { id: 202, lec: 2, t: 'tf', 
                  qE: "Mobile hydraulic systems frequently feature manually operated directional control valves.", qA: "تتميز الأنظمة الهيدروليكية المتنقلة بشكل متكرر بصمامات تحكم توجيهية تعمل يدويًا.", 
                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 0, eE: "A characteristic feature of mobile hydraulics (excavators, tractors) is that valves are frequently manually operated by the operator.", eA: "السمة المميزة للهيدروليك المتنقل (الحفارات، الجرارات) هي أن المشغل يقوم بتشغيل الصمامات يدويًا بشكل متكرر." },

                { id: 203, lec: 2, t: 'mcq', 
                  qE: "Which of the following is NOT a primary function of hydraulic oil?", qA: "أي مما يلي ليس وظيفة أساسية للزيت الهيدروليكي؟", 
                  oE: ["Lubrication of moving parts", "Cooling heat produced by energy conversion", "Generating electrical power", "Sealing components"], 
                  oA: ["تزييت الأجزاء المتحركة", "تبريد الحرارة الناتجة عن تحويل الطاقة", "توليد الطاقة الكهربائية", "إغلاق المكونات (منع التسرب)"], 
                  a: 2, eE: "Hydraulic oil transfers pressure, lubricates, cools, and seals, but does not generate electricity.", eA: "الزيت الهيدروليكي ينقل الضغط، ويزيت، ويبرد، ويمنع التسرب، ولكنه لا يولد الكهرباء." },

                { id: 204, lec: 2, t: 'tf', 
                  qE: "A hydraulic pump creates flow, but pressure does not build up until that flow encounters a resistance.", qA: "تخلق المضخة الهيدروليكية تدفقًا، لكن الضغط لا يتراكم حتى يواجه ذلك التدفق مقاومة.", 
                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 0, eE: "Pumps provide flow (displacement). Pressure is only created when the flow is restricted by a load or valve.", eA: "توفر المضخات التدفق (الإزاحة). يتم إنشاء الضغط فقط عندما يتم تقييد التدفق بواسطة حمل أو صمام." },

                { id: 205, lec: 2, t: 'mcq', 
                  qE: "What is the specific ratio that defines the volumetric efficiency of a hydraulic pump?", qA: "ما هي النسبة المحددة التي تحدد الكفاءة الحجمية للمضخة الهيدروليكية؟", 
                  oE: ["Output hydraulic power to input mechanical power", "Actual volume of fluid delivered to the maximum theoretical volume", "Pressure required to RPM", "Heat generated to energy transferred"], 
                  oA: ["الطاقة الهيدروليكية الناتجة إلى الطاقة الميكانيكية المدخلة", "الحجم الفعلي للمائع المسلم إلى الحجم النظري الأقصى", "الضغط المطلوب إلى عدد الدورات في الدقيقة", "الحرارة المتولدة إلى الطاقة المنقولة"], 
                  a: 1, eE: "Volumetric efficiency compares the actual flow delivered by the pump to its theoretical maximum flow per revolution.", eA: "تقارن الكفاءة الحجمية التدفق الفعلي الذي تسلمه المضخة بأقصى تدفق نظري لها في كل دورة." },

                { id: 206, lec: 2, t: 'mcq', 
                  qE: "Which of the following is considered a non-positive displacement pump, generally unsuited for high-pressure hydraulic circuits?", qA: "أي مما يلي يعتبر مضخة ذات إزاحة غير موجبة، وغير مناسبة عمومًا للدوائر الهيدروليكية ذات الضغط العالي؟", 
                  oE: ["Gear pump", "Axial piston pump", "Centrifugal pump", "Vane pump"], 
                  oA: ["مضخة ترسية", "مضخة مكبسية محورية", "مضخة طرد مركزي", "مضخة ريشية"], 
                  a: 2, eE: "Centrifugal pumps use kinetic energy, are not self-priming, and are limited to low-pressure applications (20-30 bars).", eA: "تستخدم مضخات الطرد المركزي الطاقة الحركية، وهي غير ذاتية التحضير، وتقتصر على تطبيقات الضغط المنخفض (20-30 بار)." },

                { id: 207, lec: 2, t: 'tf', 
                  qE: "In an external gear pump, the oil is pushed through the middle space where the gears mesh together.", qA: "في مضخة التروس الخارجية، يُدفع الزيت عبر المسافة الوسطى حيث تتشابك التروس معًا.", 
                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 1, eE: "Oil is actually carried around the OUTSIDE of each gear in the space between the gear teeth and the housing, not through the meshing center.", eA: "يُحمل الزيت في الواقع حول السطح الخارجي لكل ترس في المسافة بين أسنان الترس والغلاف، وليس عبر مركز التشابك." },

                { id: 208, lec: 2, t: 'mcq', 
                  qE: "Which type of internal gear pump utilizes an inner and an outer rotor without using a crescent-shaped stationary element?", qA: "أي نوع من مضخات التروس الداخلية يستخدم دوارًا داخليًا وخارجيًا دون استخدام عنصر ثابت على شكل هلال؟", 
                  oE: ["Crescent Internal Gear Pump", "Lobe Pump", "Gerotor Pump", "Vane Pump"], 
                  oA: ["مضخة ترسية داخلية بهلال", "مضخة فصية", "مضخة جيروتور", "مضخة ريشية"], 
                  a: 2, eE: "The Gerotor (Generated Rotor) pump uses an inner rotor with one fewer tooth than the outer rotor, needing no crescent.", eA: "تستخدم مضخة الجيروتور دوارًا داخليًا بأسنان أقل بسن واحد من الدوار الخارجي، ولا تحتاج إلى هلال." },

                { id: 209, lec: 2, t: 'tf', 
                  qE: "A lobe pump operates similarly to a gear pump, except the lobes are designed to almost meet rather than touch each other.", qA: "تعمل المضخة الفصية بشكل مشابه لمضخة التروس، باستثناء أن الفصوص مصممة بحيث تلتقي تقريبًا بدلاً من أن تتلامس مع بعضها البعض.", 
                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 0, eE: "In a lobe pump, external timing gears are often used so the lobes themselves do not drive each other, preventing actual contact.", eA: "في المضخة الفصية، غالبًا ما تستخدم تروس توقيت خارجية حتى لا تقوم الفصوص نفسها بتشغيل بعضها البعض، مما يمنع التلامس الفعلي." },

                { id: 210, lec: 2, t: 'mcq', 
                  qE: "In a piston pump, what specific phase creates a vacuum in the cylinder to draw hydraulic fluid in?", qA: "في المضخة المكبسية، ما هي المرحلة المحددة التي تخلق فراغًا في الأسطوانة لسحب السائل الهيدروليكي للداخل؟", 
                  oE: ["The compression stroke", "The suction stroke", "The displacement phase", "The relief phase"], 
                  oA: ["شوط الانضغاط", "شوط السحب", "مرحلة الإزاحة", "مرحلة التصريف"], 
                  a: 1, eE: "During the suction stroke, the piston retracts, creating a vacuum that opens the inlet check valve.", eA: "أثناء شوط السحب، يتراجع المكبس، مما يخلق فراغًا يفتح صمام فحص السحب." },

                { id: 211, lec: 2, t: 'tf', 
                  qE: "Swashplate and bent-axis pumps are two different designs of radial piston pumps.", qA: "المضخات ذات القرص المتأرجح والمحور المنحني هما تصميمان مختلفان للمضخات المكبسية القطرية (الراديال).", 
                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 1, eE: "Swashplate and bent-axis are designs of AXIAL piston pumps, not radial.", eA: "تصميم القرص المتأرجح والمحور المنحني هما للمضخات المكبسية المحورية (الأكسيال)، وليست القطرية." },

                { id: 212, lec: 2, t: 'mcq', 
                  qE: "How is the displacement volume of a swashplate axial piston pump altered (variable displacement)?", qA: "كيف يتم تغيير حجم الإزاحة لمضخة مكبسية محورية ذات قرص متأرجح (إزاحة متغيرة)؟", 
                  oE: ["By altering the diameter of the pistons", "By varying the speed of the motor", "By changing the angle of the swashplate", "By bypassing fluid to the tank"], 
                  oA: ["عن طريق تغيير قطر المكابس", "عن طريق تغيير سرعة المحرك", "عن طريق تغيير زاوية القرص المتأرجح", "عن طريق تحويل السائل إلى الخزان"], 
                  a: 2, eE: "Increasing or decreasing the swash angle alters the stroke length of the pistons, changing the pump's displacement.", eA: "تؤدي زيادة أو تقليل زاوية القرص المتأرجح إلى تغيير طول شوط المكابس، مما يغير إزاحة المضخة." },

                { id: 213, lec: 2, t: 'mcq', 
                  qE: "Based on pump performance charts, which pump type generally reaches the highest nominal pressures (up to 350+ bar)?", qA: "بناءً على مخططات أداء المضخة، أي نوع من المضخات يصل عمومًا إلى أعلى ضغوط اسمية (تصل إلى 350+ بار)؟", 
                  oE: ["Gear pump", "Vane pump", "Axial / Radial Piston pump", "Centrifugal pump"], 
                  oA: ["مضخة ترسية", "مضخة ريشية", "مضخة مكبسية محورية / قطرية", "مضخة طرد مركزي"], 
                  a: 2, eE: "Piston pumps (axial and radial) are designed for very high-pressure applications compared to gear or vane pumps.", eA: "صممت المضخات المكبسية (المحورية والقطرية) لتطبيقات الضغط العالي جدًا مقارنة بالمضخات الترسية أو الريشية." },

                { id: 214, lec: 2, t: 'tf', 
                  qE: "In standard hydraulic systems, gear pumps typically operate with higher total efficiency than axial piston pumps.", qA: "في الأنظمة الهيدروليكية القياسية، تعمل المضخات الترسية عادةً بكفاءة كلية أعلى من المضخات المكبسية المحورية.", 
                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 1, eE: "Axial piston pumps typically have higher total efficiency (0.85-0.95) compared to gear pumps (0.8-0.91).", eA: "عادة ما يكون للمضخات المكبسية المحورية كفاءة كلية أعلى (0.85-0.95) مقارنة بالمضخات الترسية (0.8-0.91)." },

                { id: 215, lec: 2, t: 'mcq', 
                  qE: "Which component is strictly responsible for blindly converting hydraulic energy into linear mechanical energy?", qA: "أي مكون مسؤول بدقة عن التحويل الأعمى للطاقة الهيدروليكية إلى طاقة ميكانيكية خطية؟", 
                  oE: ["Hydraulic Motor", "Hydraulic Cylinder (Actuator)", "Directional Valve", "Accumulator"], 
                  oA: ["المحرك الهيدروليكي", "الأسطوانة الهيدروليكية (المشغل)", "صمام التوجيه", "المجمع الهيدروليكي"], 
                  a: 1, eE: "Hydraulic cylinders generate linear movements through pressure on the surface of a movable piston.", eA: "تولد الأسطوانات الهيدروليكية حركات خطية من خلال الضغط على سطح المكبس المتحرك." },

                { id: 216, lec: 2, t: 'tf', 
                  qE: "A single-acting cylinder can exert force in both extension and retraction directions using hydraulic fluid.", qA: "يمكن لأسطوانة مفردة الفعل أن تمارس قوة في كلا اتجاهي الامتداد والتراجع باستخدام السائل الهيدروليكي.", 
                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 1, eE: "A single-acting cylinder exerts hydraulic force in only one direction. Return is usually achieved by gravity or a spring.", eA: "تمارس الأسطوانة مفردة الفعل القوة الهيدروليكية في اتجاه واحد فقط. عادة ما يتم العودة عن طريق الجاذبية أو الزنبرك." },

                { id: 217, lec: 2, t: 'mcq', 
                  qE: "When designing a hydraulic circuit, what is the accepted general rule for sizing the volume of the oil tank?", qA: "عند تصميم دائرة هيدروليكية، ما هي القاعدة العامة المقبولة لتحديد حجم خزان الزيت؟", 
                  oE: ["It should be exactly equal to the pump flow in gpm", "It should be 2 to 4 times the pump flow in gpm", "It should be 10 times the pump flow in gpm", "Tank volume is irrelevant to pump flow"], 
                  oA: ["يجب أن يكون مساوياً تماماً لتدفق المضخة بجالون/دقيقة", "يجب أن يكون من 2 إلى 4 أضعاف تدفق المضخة بجالون/دقيقة", "يجب أن يكون 10 أضعاف تدفق المضخة بجالون/دقيقة", "حجم الخزان لا علاقة له بتدفق المضخة"], 
                  a: 1, eE: "The standard engineering rule dictates the tank volume should be 2 to 4 times the pump flow rate to allow for cooling and air separation.", eA: "تنص القاعدة الهندسية القياسية على أن حجم الخزان يجب أن يكون من 2 إلى 4 أضعاف معدل تدفق المضخة للسماح بالتبريد وفصل الهواء." },

                { id: 218, lec: 2, t: 'tf', 
                  qE: "Vane pumps utilize a rotor with slots containing sliding vanes that move outward due to centrifugal force to trap fluid.", qA: "تستخدم المضخات الريشية دوارًا به فتحات تحتوي على ريش منزلقة تتحرك للخارج بسبب قوة الطرد المركزي لاحتجاز السائل.", 
                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 0, eE: "In a rotary vane pump, vanes slide out of the rotor slots and seal against the cam ring, creating expanding and contracting chambers.", eA: "في المضخة الريشية الدوارة، تنزلق الريش خارج فتحات الدوار وتغلق مقابل حلقة الكامة، مما يخلق غرفًا متمددة ومتقلصة." },

                { id: 219, lec: 2, t: 'mcq', 
                  qE: "Telescoping cylinders are uniquely designed for what application purpose?", qA: "تم تصميم الأسطوانات التلسكوبية بشكل فريد لأي غرض تطبيقي؟", 
                  oE: ["High-speed oscillation", "Achieving a long stroke from a compact initial length", "Simultaneous rotary and linear motion", "Continuous rotation"], 
                  oA: ["الاهتزاز عالي السرعة", "تحقيق شوط طويل من طول أولي مضغوط (قصير)", "الحركة الدورانية والخطية المتزامنة", "الدوران المستمر"], 
                  a: 1, eE: "Telescoping cylinders feature nested stages to provide a long extension stroke from a relatively short retracted length (e.g., dump trucks).", eA: "تتميز الأسطوانات التلسكوبية بمراحل متداخلة لتوفير شوط امتداد طويل من طول تراجع قصير نسبيًا (مثل الشاحنات القلابة)." },

                { id: 220, lec: 2, t: 'tf', 
                  qE: "A hydraulic motor represents the power generation (input) section of a complete fluid power system.", qA: "يمثل المحرك الهيدروليكي قسم توليد الطاقة (الإدخال) لنظام طاقة الموائع الكامل.", 
                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 1, eE: "A hydraulic motor is an ACTUATOR (power output section) that converts hydraulic energy into continuous rotary mechanical energy.", eA: "المحرك الهيدروليكي هو مشغل (قسم إخراج الطاقة) يقوم بتحويل الطاقة الهيدروليكية إلى طاقة ميكانيكية دورانية مستمرة." },

                // === LECTURE 3 ===
                { id: 301, lec: 3, t: 'mcq', 
                  qE: "Which of the following is an explicit function of a hydraulic reservoir?", qA: "أي مما يلي هو وظيفة صريحة للخزان الهيدروليكي؟", 
                  oE: ["Generating primary system pressure", "Separating dirt and allowing air to bubble out", "Filtering sub-micron particles automatically", "Converting hydraulic energy into rotary motion"], 
                  oA: ["توليد ضغط النظام الأساسي", "فصل الأوساخ والسماح بفقاعات الهواء بالخروج", "تصفية الجسيمات دون الميكرون تلقائيًا", "تحويل الطاقة الهيدروليكية إلى حركة دورانية"], 
                  a: 1, eE: "Reservoirs provide air space for bubbles to escape, allow heavy dirt to settle, and transfer heat.", eA: "توفر الخزانات مساحة هوائية للفقاعات للهروب، وتسمح للأوساخ الثقيلة بالاستقرار، وتنقل الحرارة." },

                { id: 302, lec: 3, t: 'tf', 
                  qE: "A baffle plate inside a hydraulic tank is primarily used to separate fluid entering the return line from fluid entering the pump suction line.", qA: "تستخدم لوحة الحاجز (Baffle) داخل الخزان الهيدروليكي بشكل أساسي لفصل السائل الداخل من خط العودة عن السائل الداخل لخط سحب المضخة.", 
                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 0, eE: "The baffle forces returning fluid to travel the length of the tank before being sucked back in, allowing time for cooling and air separation.", eA: "يجبر الحاجز السائل العائد على قطع طول الخزان قبل أن يتم سحبه مرة أخرى، مما يتيح وقتًا للتبريد وفصل الهواء." },

                { id: 303, lec: 3, t: 'mcq', 
                  qE: "Where is a 'pressure-line filter' located in a hydraulic circuit?", qA: "أين يوجد 'مرشح خط الضغط' في دائرة هيدروليكية؟", 
                  oE: ["Before the pump to protect it from large tank debris", "Between the control valve and the reservoir", "Downstream from the pump to protect sensitive actuators", "On top of the reservoir as a breather"], 
                  oA: ["قبل المضخة لحمايتها من حطام الخزان الكبير", "بين صمام التحكم والخزان", "أسفل تيار المضخة (بعدها) لحماية المشغلات الحساسة", "أعلى الخزان كمنفذ تنفس"], 
                  a: 2, eE: "Pressure-line filters are placed after the pump to clean fluid before it reaches high-precision valves and actuators.", eA: "توضع مرشحات خط الضغط بعد المضخة لتنظيف السائل قبل وصوله إلى الصمامات والمشغلات عالية الدقة." },

                { id: 304, lec: 3, t: 'tf', 
                  qE: "Strainers are generally utilized to remove contaminants that are strictly smaller than 50 microns.", qA: "تُستخدم المصافي (Strainers) بشكل عام لإزالة الملوثات التي تقل بدقة عن 50 ميكرون.", 
                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 1, eE: "Filters remove particles smaller than 50 microns, while strainers are used for particles 50 microns or greater.", eA: "تزيل المرشحات الجزيئات التي يقل حجمها عن 50 ميكرون، بينما تُستخدم المصافي للجسيمات التي يبلغ حجمها 50 ميكرون أو أكثر." },

                { id: 305, lec: 3, t: 'mcq', 
                  qE: "What is the primary function of a Directional Control Valve in a fluid power system?", qA: "ما هي الوظيفة الأساسية لصمام التحكم التوجيهي في نظام طاقة الموائع؟", 
                  oE: ["To limit the maximum system pressure", "To stop, allow, and change the direction of fluid flow", "To cool the hydraulic fluid", "To infinitely control the speed of an actuator"], 
                  oA: ["للحد من أقصى ضغط للنظام", "لإيقاف، والسماح، وتغيير اتجاه تدفق المائع", "لتبريد السائل الهيدروليكي", "للتحكم غير المحدود في سرعة المشغل"], 
                  a: 1, eE: "Directional valves direct the path of the fluid, determining actuator direction (stop, extend, retract).", eA: "تقوم الصمامات التوجيهية بتوجيه مسار السائل، لتحديد اتجاه المشغل (إيقاف، تمديد، تراجع)." },

                { id: 306, lec: 3, t: 'tf', 
                  qE: "In schematic symbols for directional control valves, the number of connection points on a single square represents the number of valve positions.", qA: "في الرموز التخطيطية لصمامات التحكم التوجيهية، يمثل عدد نقاط الاتصال على مربع واحد عدد مواضع (Positions) الصمام.", 
                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 1, eE: "The number of SQUARES represents positions. The number of CONNECTION POINTS on the square represents the ports (ways).", eA: "يمثل عدد المربعات المواضع. بينما يمثل عدد نقاط الاتصال على المربع المنافذ (Ways)." },

                { id: 307, lec: 3, t: 'mcq', 
                  qE: "A control valve designated as '3/2' implies that the valve has:", qA: "صمام التحكم المسمى '3/2' يعني أن الصمام يحتوي على:", 
                  oE: ["3 positions and 2 ports", "3 ports and 2 positions", "3 actuators and 2 pumps", "3 pressure settings and 2 flow rates"], 
                  oA: ["3 مواضع و 2 منافذ", "3 منافذ و 2 مواضع", "3 مشغلات و 2 مضخات", "3 إعدادات ضغط و 2 معدلات تدفق"], 
                  a: 1, eE: "Standard naming convention is Ports/Positions. So 3/2 means 3 ports (ways) and 2 positions.", eA: "اصطلاح التسمية القياسي هو المنافذ/المواضع. لذا فإن 3/2 تعني 3 منافذ (طرق) ووضعيتين." },

                { id: 308, lec: 3, t: 'mcq', 
                  qE: "Which component operates by preventing fluid reversal, opening only when fluid pressure pushes in the correct direction?", qA: "أي مكون يعمل عن طريق منع انعكاس السائل، ويفتح فقط عندما يدفع ضغط السائل في الاتجاه الصحيح؟", 
                  oE: ["Pressure Relief Valve", "Throttle Valve", "Check Valve (Non-return valve)", "Accumulator"], 
                  oA: ["صمام تصريف الضغط", "صمام الخنق", "صمام عدم الرجوع", "المجمع"], 
                  a: 2, eE: "Check valves (non-return valves) prevent the reversal of flow in a piping system.", eA: "تمنع صمامات الفحص (صمامات عدم الرجوع) انعكاس التدفق في نظام الأنابيب." },

                { id: 309, lec: 3, t: 'tf', 
                  qE: "A throttle check valve allows infinitely controlled flow in one direction while providing completely free flow in the reverse direction.", qA: "يسمح صمام خنق عدم الرجوع بالتحكم اللانهائي في التدفق في اتجاه واحد بينما يوفر تدفقًا حرًا تمامًا في الاتجاه المعاكس.", 
                  oE: ["True", "False"], oA: ["صح", "خطأ"], 
                  a: 0, eE: "This combination is typically used for actuator speed control (meter-in or meter-out) in one direction only.", eA: "يتم استخدام هذا المزيج عادةً للتحكم في سرعة المشغل (المعايرة للداخل أو الخارج) في اتجاه واحد فقط." },

                { id: 310, lec: 3, t: 'mcq', 
                  qE: "What is the primary function of a hydraulic accumulator?", qA: "ما هي الوظيفة الأساسية للمجمع الهيدروليكي؟", 
                  oE: ["To convert hydraulic energy back to heat", "To maintain pressure, recapture energy, and dampen shocks", "To filter sub-micron metallic particles", "To automatically steer the machine"],

        // --- APPLICATION STATE ---
        const app = {

                const html = document.documentElement;
                const icon = document.getElementById('theme-icon');
                if(html.classList.contains('dark')) {
                    html.classList.remove('dark');
                    html.classList.add('light');
                    icon.className = 'fa-solid fa-moon';
                } else {
                    html.classList.remove('light');
                    html.classList.add('dark');
                    icon.className = 'fa-solid fa-sun';

            },

            // --- RENDERERS ---
            renderHome: function() {
                const container = document.getElementById('app-container');
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-[70vh] text-center fade-in">
                        <div class="w-24 h-24 bg-cyan-100 dark:bg-cyan-900/50 rounded-full flex items-center justify-center mb-6">

                        <h2 class="text-xl sm:text-2xl text-steel-500 dark:text-steel-400 ar-text mb-8">منصة اختبارات تطبيقات النيوماتيك و الهيدروليك</h2>
                        
                        <div class="flex gap-4 flex-wrap justify-center mb-10">
                            <div class="bg-white dark:bg-navy-800 shadow-md border border-gray-200 dark:border-slate-700 rounded-xl p-4 min-w-[150px]">
                                <p class="text-3xl font-bold text-slate-800 dark:text-white">${DB.lectures.length}</p>

                            </div>
                            <div class="bg-white dark:bg-navy-800 shadow-md border border-gray-200 dark:border-slate-700 rounded-xl p-4 min-w-[150px]">

                                    </label>

                        </div>

                `;
                this.state.timer = true; // Default
            },

            startExam: function() {
                this.state.answers = {};
                this.state.langStatus = {};
                this.state.currentQuestionIndex = 0;
                this.state.examQuestions = DB.questions.filter(q => q.lec === this.state.activeLecture.id);
                
                if(this.state.timer) {
                    this.state.timeLeft = 600; // 10 min
                    this.state.interval = setInterval(() => this.tick(), 1000);
                }
                
                this.navigate('exam');
            },

            tick: function() {
                this.state.timeLeft--;
                const min = Math.floor(this.state.timeLeft / 60).toString().padStart(2, '0');
                const sec = (this.state.timeLeft % 60).toString().padStart(2, '0');
                const timerEl = document.getElementById('exam-timer');
                if(timerEl) {
                    timerEl.innerText = `${min}:${sec}`;
                    if(this.state.timeLeft < 60) timerEl.classList.add('text-red-500', 'animate-pulse');
                }
                if(this.state.timeLeft <= 0) {
                    clearInterval(this.state.interval);
                    this.submitExam(true);
                }
            },

            toggleLang: function(qId) {
                this.state.langStatus[qId] = this.state.langStatus[qId] === 'ar' ? 'en' : 'ar';
                this.renderActiveQuestion();
            },

                this.state.answers[qId] = optIdx;
                this.renderActiveQuestion(); // re-render to show selection
                this.updateGrid();

                            </div>
                        </div>
                    </div>
                `;
                
                this.renderActiveQuestion();
                this.buildGrid();
            },

            renderActiveQuestion: function() {
                const idx = this.state.currentQuestionIndex;
                const q = this.state.examQuestions[idx];
                const lang = this.state.langStatus[q.id] || 'en';
                const isAr = lang === 'ar';
                
                document.getElementById('q-progress').innerText = `Question ${idx + 1} of 20`;
                
                let optsHtml = '';
                const opts = isAr ? q.oA : q.oE;
                opts.forEach((opt, oIdx) => {
                    const isSelected = this.state.answers[q.id] === oIdx;
                    optsHtml += `
                        <div onclick="app.selectAnswer(${q.id}, ${oIdx})" class="p-4 rounded-xl border-2 cursor-pointer transition-all ${isSelected ? 'border-cyan-500 bg-cyan-50 dark:bg-cyan-900/20' : 'border-gray-200 dark:border-slate-700 bg-white dark:bg-navy-800 hover:border-cyan-300 dark:hover:border-cyan-700'} flex items-center">
                            <div class="w-6 h-6 rounded-full border-2 mr-4 ${isAr ? 'ml-4 mr-0' : ''} flex items-center justify-center flex-shrink-0 ${isSelected ? 'border-cyan-500' : 'border-gray-300 dark:border-slate-600'}">
                                ${isSelected ? '<div class="w-3 h-3 rounded-full bg-cyan-500"></div>' : ''}
                            </div>
                            <span class="${isAr ? 'ar-text text-lg' : 'en-text text-base'} w-full">${opt}</span>
                        </div>
                    `;
                });

                document.getElementById('q-container').innerHTML = `
                    <div class="bg-white dark:bg-navy-800 shadow-md border border-gray-200 dark:border-slate-700 rounded-2xl p-6 flex-grow flex flex-col fade-in">
                        <div class="flex justify-between items-start mb-6 border-b border-gray-100 dark:border-slate-700 pb-4">
                            <span class="bg-gray-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full">
                                ${q.t === 'mcq' ? 'Multiple Choice' : 'True / False'}
                            </span>
                            <button onclick="app.toggleLang(${q.id})" class="text-sm font-bold bg-cyan-100 text-cyan-700 hover:bg-cyan-200 dark:bg-cyan-900/50 dark:text-cyan-400 dark:hover:bg-cyan-800 px-3 py-1 rounded transition-colors">
                                <i class="fa-solid fa-language mr-1"></i> ${isAr ? 'English' : 'عربي'}
                            </button>
                        </div>
                        
                        <h3 class="text-xl font-bold mb-8 ${isAr ? 'ar-text text-2xl leading-relaxed' : 'en-text'}">${isAr ? q.qA : q.qE}</h3>
                        
                        <div class="space-y-3 flex-grow">
                            ${optsHtml}
                        </div>
                    </div>
                `;

                // Update Buttons
                document.getElementById('btn-prev').disabled = idx === 0;
                const btnNext = document.getElementById('btn-next');
                if (idx === 19) {
                    btnNext.innerHTML = `<i class="fa-solid fa-check-double mr-2"></i> Submit`;
                    btnNext.className = "bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-8 rounded-lg shadow-md transition-colors";
                    btnNext.onclick = () => app.confirmSubmit();
                } else {
                    btnNext.innerHTML = `Next <i class="fa-solid fa-arrow-right ml-2"></i>`;
                    btnNext.className = "bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2 px-8 rounded-lg shadow-md transition-colors";
                    btnNext.onclick = () => app.nextQ();
                }
            },

            buildGrid: function() {
                let html = '';
                for(let i=0; i<20; i++) {
                    html += `<button onclick="app.jumpQ(${i})" id="grid-btn-${i}" class="w-10 h-10 rounded-md font-bold text-sm transition-colors border ${i === this.state.currentQuestionIndex ? 'border-cyan-500 ring-2 ring-cyan-200 dark:ring-cyan-900' : 'border-gray-200 dark:border-slate-700'}"></button>`;
                }
                document.getElementById('q-grid').innerHTML = html;
                this.updateGrid();
            },

            updateGrid: function() {
                for(let i=0; i<20; i++) {
                    const qId = this.state.examQuestions[i].id;
                    const btn = document.getElementById(`grid-btn-${i}`);
                    const answered = this.state.answers[qId] !== undefined;
                    
                    if(i === this.state.currentQuestionIndex) {
                        btn.className = `w-10 h-10 rounded-md font-bold text-sm transition-colors border border-cyan-500 ring-2 ring-cyan-200 dark:ring-cyan-900 ${answered ? 'bg-cyan-600 text-white' : 'bg-white dark:bg-navy-800'}`;
                    } else {
                        btn.className = `w-10 h-10 rounded-md font-bold text-sm transition-colors border border-gray-200 dark:border-slate-700 ${answered ? 'bg-cyan-600 text-white border-cyan-600' : 'bg-gray-50 dark:bg-slate-700 hover:bg-gray-200 dark:hover:bg-slate-600'}`;
                    }
                    btn.innerText = i + 1;
                }
            },

            nextQ: function() { if(this.state.currentQuestionIndex < 19) { this.state.currentQuestionIndex++; this.renderActiveQuestion(); this.updateGrid(); } },
            prevQ: function() { if(this.state.currentQuestionIndex > 0) { this.state.currentQuestionIndex--; this.renderActiveQuestion(); this.updateGrid(); } },
            jumpQ: function(i) { this.state.currentQuestionIndex = i; this.renderActiveQuestion(); this.updateGrid(); },

            confirmSubmit: function() {
                const answeredCount = Object.keys(this.state.answers).length;
                const modal = document.getElementById('submit-modal');
                const desc = document.getElementById('modal-desc');
                
                if (answeredCount < 20) {
                    desc.innerHTML = `You have <strong>${20 - answeredCount} unanswered</strong> questions. Are you sure you want to submit?`;
                } else {
                    desc.innerText = "You have answered all questions. Ready to submit?";
                }
                
                modal.classList.remove('hide');
                setTimeout(() => modal.classList.remove('opacity-0'), 10);
            },

            submitExam: function(auto = false) {
                if(this.state.interval) clearInterval(this.state.interval);
                
                let score = 0;
                this.state.examQuestions.forEach(q => {
                    if(this.state.answers[q.id] === q.a) score++;
                });

                this.state.latestScore = score;
                
                // Save progress
                const lecId = this.state.activeLecture.id;
                const prevBest = this.state.progress.lectureScores[lecId] || 0;
                if(score > prevBest) this.state.progress.lectureScores[lecId] = score;
                this.state.progress.examsTaken++;
                localStorage.setItem('ph_progress', JSON.stringify(this.state.progress));

                this.navigate('results');
            },

            renderResults: function() {
                const score = this.state.latestScore;
                const perc = (score / 20) * 100;
                const answeredCount = Object.keys(this.state.answers).length;
                let level = "Needs Review"; let color = "text-red-500";
                if(perc >= 90) { level = "Excellent"; color = "text-green-500"; }
                else if(perc >= 80) { level = "Very Good"; color = "text-cyan-500"; }
                else if(perc >= 70) { level = "Good"; color = "text-blue-500"; }
                else if(perc >= 60) { level = "Needs Improvement"; color = "text-orange-500"; }

                document.getElementById('app-container').innerHTML = `
                    <div class="fade-in max-w-3xl mx-auto mt-8">
                        <div class="bg-white dark:bg-navy-800 shadow-xl border border-gray-200 dark:border-slate-700 rounded-2xl p-8 text-center mb-8">
                            <h2 class="text-3xl font-bold mb-2">Exam Results</h2>
                            <p class="text-steel-500 dark:text-steel-400 mb-8">${this.state.activeLecture.title}</p>
                            
                            <div class="flex flex-col sm:flex-row justify-center items-center gap-8 mb-8">
                                <div class="relative w-40 h-40 flex items-center justify-center">
                                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                        <path class="text-gray-100 dark:text-slate-700" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                        <path class="${color.replace('text-','text-')}" stroke-dasharray="${perc}, 100" stroke-width="3" stroke="currentColor" fill="none" stroke-linecap="round" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    </svg>
                                    <div class="absolute text-3xl font-bold">${perc}%</div>
                                </div>
                                <div class="text-left space-y-4">
                                    <div class="text-4xl font-bold ${color}">${level}</div>
                                    <div class="text-xl">Score: <strong>${score} / 20</strong></div>
                                    <div class="grid grid-cols-2 gap-x-6 gap-y-2 text-sm text-steel-600 dark:text-steel-300">
                                        <div><i class="fa-solid fa-check text-green-500 mr-2"></i> Correct: ${score}</div>
                                        <div><i class="fa-solid fa-xmark text-red-500 mr-2"></i> Wrong: ${answeredCount - score}</div>
                                        <div class="col-span-2"><i class="fa-solid fa-circle-question text-orange-400 mr-2"></i> Unanswered: ${20 - answeredCount}</div>
                                    </div>
                                </div>
                            </div>

                            <div class="flex gap-4 justify-center">
                                <button onclick="app.navigate('review')" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                                    <i class="fa-solid fa-magnifying-glass mr-2"></i> Review Questions
                                </button>
                                <button onclick="app.navigate('lectures')" class="bg-slate-800 hover:bg-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                                    Finish
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderReview: function() {
                let html = `
                    <div class="fade-in max-w-4xl mx-auto mt-4">
                        <div class="flex justify-between items-center mb-6 border-b border-gray-200 dark:border-slate-700 pb-4">
                            <h2 class="text-2xl font-bold">Review: ${this.state.activeLecture.title}</h2>
                            <button onclick="app.navigate('results')" class="text-cyan-600 dark:text-cyan-400 font-bold hover:underline">Back to Results</button>
                        </div>
                        <div class="space-y-6">
                `;

                this.state.examQuestions.forEach((q, idx) => {
                    const uAns = this.state.answers[q.id];
                    const isCorrect = uAns === q.a;
                    const isUnanswered = uAns === undefined;
                    
                    let statusIcon = isCorrect ? '<i class="fa-solid fa-circle-check text-green-500 text-2xl"></i>' : 
                                     isUnanswered ? '<i class="fa-solid fa-circle-question text-orange-400 text-2xl"></i>' : 
                                     '<i class="fa-solid fa-circle-xmark text-red-500 text-2xl"></i>';
                    
                    let optsHtml = '';
                    q.oE.forEach((opt, oIdx) => {
                        let styling = "border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800";
                        if (oIdx === q.a) styling = "border-green-500 bg-green-50 dark:bg-green-900/20 ring-1 ring-green-500";
                        else if (oIdx === uAns && !isCorrect) styling = "border-red-500 bg-red-50 dark:bg-red-900/20 ring-1 ring-red-500";

                        optsHtml += `
                            <div class="p-3 rounded-lg border ${styling} mb-2 flex items-center justify-between">
                                <div>
                                    <span class="block text-sm">${opt}</span>
                                    <span class="block text-sm ar-text text-steel-500 dark:text-steel-400 mt-1">${q.oA[oIdx]}</span>
                                </div>
                                ${oIdx === q.a ? '<i class="fa-solid fa-check text-green-500"></i>' : (oIdx === uAns ? '<i class="fa-solid fa-xmark text-red-500"></i>' : '')}
                            </div>
                        `;
                    });

                    html += `
                        <div class="bg-white dark:bg-navy-800 shadow-sm border ${isCorrect ? 'border-green-200 dark:border-green-900/50' : 'border-gray-200 dark:border-slate-700'} rounded-xl p-6 relative">
                            <div class="absolute top-6 right-6">${statusIcon}</div>
                            <h4 class="font-bold text-sm text-steel-500 mb-2">QUESTION ${idx + 1}</h4>
                            <p class="font-medium text-lg mb-1 pr-8">${q.qE}</p>
                            <p class="ar-text text-steel-600 dark:text-steel-400 mb-6 pr-8">${q.qA}</p>
                            <div class="mb-6">${optsHtml}</div>
                            
                            ${!isCorrect ? `
                                <div class="bg-blue-50 dark:bg-blue-900/20 border-l-4 border-blue-500 p-4 rounded-r-lg">
                                    <h5 class="font-bold text-blue-700 dark:text-blue-400 text-sm mb-1"><i class="fa-solid fa-lightbulb mr-1"></i> EXPLANATION</h5>
                                    <p class="text-sm mb-1">${q.eE}</p>
                                    <p class="text-sm ar-text">${q.eA}</p>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });

                html += `</div></div>`;
                document.getElementById('app-container').innerHTML = html;
            },

            renderDashboard: function() {
                let lecProgressHtml = '';
                DB.lectures.forEach(l => {
                    const best = this.state.progress.lectureScores[l.id] || 0;
                    const perc = (best / 20) * 100;
                    lecProgressHtml += `
                        <div class="mb-4">
                            <div class="flex justify-between text-sm mb-1">
                                <span class="font-bold">${l.title}</span>
                                <span>${perc}% (${best}/20)</span>
                            </div>
                            <div class="w-full bg-gray-200 dark:bg-slate-700 rounded-full h-2.5">
                                <div class="bg-cyan-600 h-2.5 rounded-full" style="width: ${perc}%"></div>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('app-container').innerHTML = `
                    <div class="fade-in max-w-4xl mx-auto mt-4">
                        <h2 class="text-3xl font-bold mb-6">Student Dashboard</h2>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <div class="bg-white dark:bg-navy-800 shadow-md border border-gray-200 dark:border-slate-700 rounded-xl p-6 flex items-center gap-4">
                                <div class="w-16 h-16 rounded-full bg-cyan-100 dark:bg-cyan-900/50 flex items-center justify-center text-cyan-600 text-2xl">
                                    <i class="fa-solid fa-graduation-cap"></i>
                                </div>
                                <div>
                                    <p class="text-sm text-steel-500 font-bold uppercase tracking-wider">Exams Completed</p>
                                    <p class="text-3xl font-bold">${this.state.progress.examsTaken}</p>
                                </div>
                            </div>
                            
                            <div class="bg-white dark:bg-navy-800 shadow-md border border-gray-200 dark:border-slate-700 rounded-xl p-6 flex items-center gap-4">
                                <div class="w-16 h-16 rounded-full bg-green-100 dark:bg-green-900/50 flex items-center justify-center text-green-600 text-2xl">
                                    <i class="fa-solid fa-check-to-slot"></i>
                                </div>
                                <div>
                                    <p class="text-sm text-steel-500 font-bold uppercase tracking-wider">Lectures Attempted</p>
                                    <p class="text-3xl font-bold">${Object.keys(this.state.progress.lectureScores).length} / 3</p>
                                </div>
                            </div>
                        </div>

                        <div class="bg-white dark:bg-navy-800 shadow-md border border-gray-200 dark:border-slate-700 rounded-xl p-6">
                            <h3 class="text-xl font-bold mb-6 border-b border-gray-200 dark:border-slate-700 pb-2">Lecture Progress (Best Scores)</h3>
                            ${lecProgressHtml}
                        </div>
                    </div>
                `;
            }
        };

        // Initialize App
        window.onload = () => {
            // Check system theme preference if not set
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
                document.getElementById('theme-icon').className = 'fa-solid fa-sun';
            }
            app.navigate('home');
        };
    </script>
</body>
</html>
